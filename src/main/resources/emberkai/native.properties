# Files that keep IntelliJ type icons and modifier badges.
file.extensions=java,class,kt,kts
# Tool build scripts may still use an icon from icons.properties.
file.toolScriptSuffixes=.gradle.kts

# IDE metadata and generated folders retain their specialized native icons.
folder.names=.idea,generated,generated-sources,generated-test-sources
# All descendants of these folders also keep native icons.
folder.trees=.idea

# Library, excluded, and project roots remain native. ProjectFolderIcons themes
# JVM source/test/resource roots and packages using their actual IDE root roles.
