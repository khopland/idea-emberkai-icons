# Files whose icons and badges come from the language plugin.
file.extensions=java,class,kt,kts
# Tool build scripts may still use an icon from icons.properties.
file.toolScriptSuffixes=.gradle.kts

# Generated folders retain their specialized native icons. The .idea folder itself
# gets IntelliJ IDEA artwork from icons.properties.
folder.names=generated,generated-sources,generated-test-sources
# All descendants of these folders keep native icons.
folder.trees=.idea

# Library, excluded, and project roots remain native. ProjectFolderIcons themes
# JVM/Multiplatform source/test/resource roots and packages using their IDE roles.
