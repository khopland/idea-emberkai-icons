# Files that keep IntelliJ type icons and modifier badges.
file.extensions=java,class,kt,kts
# Tool build scripts may still use an icon from icons.properties.
file.toolScriptSuffixes=.gradle.kts

# Folder names that keep the IDE icon even before project roots are imported.
folder.names=.idea,src,main,test,tests,java,kotlin,resources,generated,generated-sources,generated-test-sources
# All descendants of these folders also keep native icons.
folder.trees=.idea

# Actual source, test, resource, library, content, and excluded roots are always
# delegated to IntelliJ by NativeIconPolicy, regardless of these name lists.
