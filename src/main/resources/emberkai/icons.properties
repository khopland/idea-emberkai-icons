folder.role.test-source=/emberkai/icons/folders/folder-test-source.svg
folder.role.resources=/emberkai/icons/folders/folder-resources.svg
folder.role.test-resources=/emberkai/icons/folders/folder-test-resources.svg
folder.role.package=/emberkai/icons/folders/folder-package.svg
