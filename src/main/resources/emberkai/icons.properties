# Emberkai additions. Values are absolute classpath resource paths.
# Everything in emberkai/ survives scripts/update-icons.sh.
# Prefix a file, extension, or folder name with parent segments for context.

# GitHub Actions and repository metadata.
extension..github/workflows/yaml=/symbols/icons/files/github.svg
extension..github/workflows/yml=/symbols/icons/files/github.svg
file.action.yaml=/symbols/icons/files/github.svg
file.action.yml=/symbols/icons/files/github.svg
file.codeowners=/symbols/icons/files/github.svg
file..github/dependabot.yaml=/symbols/icons/files/github.svg
file..github/dependabot.yml=/symbols/icons/files/github.svg
file..github/funding.yaml=/symbols/icons/files/github.svg
file..github/funding.yml=/symbols/icons/files/github.svg
folder..github/actions=/symbols/icons/folders/folder-github.svg
folder..github/workflows=/symbols/icons/folders/folder-github.svg

# Development containers.
file..devcontainer.json=/symbols/icons/files/docker.svg
file.devcontainer.json=/symbols/icons/files/docker.svg
folder..devcontainer=/symbols/icons/folders/folder-docker.svg

# Additional standard Renovate configuration filenames.
file..renovaterc.json=/symbols/icons/files/renovate.svg
file..renovaterc.json5=/symbols/icons/files/renovate.svg
