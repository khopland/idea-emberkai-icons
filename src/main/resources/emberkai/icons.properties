file.gradlew.bat=/symbols/icons/files/gradle.svg
file.pom.xml=/emberkai/icons/maven.svg
file.mvnw=/emberkai/icons/maven.svg
file.mvnw.cmd=/emberkai/icons/maven.svg
extension.pom=/emberkai/icons/maven.svg
file..mvn/maven.config=/emberkai/icons/maven.svg
file..mvn/jvm.config=/emberkai/icons/maven.svg
