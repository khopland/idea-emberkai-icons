# Emberkai additions. Values are absolute classpath resource paths.
# Everything in emberkai/ survives scripts/update-icons.sh.
# Prefix a file, extension, or folder name with parent segments for context.

# GitHub Actions and repository metadata.
extension..github/workflows/yaml=/symbols/icons/files/github.svg
extension..github/workflows/yml=/symbols/icons/files/github.svg
file.action.yaml=/symbols/icons/files/github.svg
file.action.yml=/symbols/icons/files/github.svg
file.codeowners=/symbols/icons/files/github.svg
file..github/dependabot.yaml=/symbols/icons/files/github.svg
file..github/dependabot.yml=/symbols/icons/files/github.svg
file..github/funding.yaml=/symbols/icons/files/github.svg
file..github/funding.yml=/symbols/icons/files/github.svg
folder..github/actions=/symbols/icons/folders/folder-github.svg
folder..github/workflows=/symbols/icons/folders/folder-github.svg

# Development containers.
file..devcontainer.json=/symbols/icons/files/docker.svg
file.devcontainer.json=/symbols/icons/files/docker.svg
folder..devcontainer=/symbols/icons/folders/folder-docker.svg

# Additional standard Renovate configuration filenames.
file..renovaterc.json=/symbols/icons/files/renovate.svg
file..renovaterc.json5=/symbols/icons/files/renovate.svg
file..renovaterc.jsonc=/symbols/icons/files/renovate.svg

# Upstream provides these icons through VS Code language IDs.
extension.vue=/symbols/icons/files/vue.svg
extension.php=/symbols/icons/files/php.svg
extension.phtml=/symbols/icons/files/php.svg
extension.clj=/symbols/icons/files/clojure.svg
extension.cljs=/symbols/icons/files/clojure.svg
extension.cljc=/symbols/icons/files/clojure.svg
extension.coffee=/symbols/icons/files/coffeescript.svg

# Build tools and CI.
file..gitlab-ci.yaml=/symbols/icons/files/gitlab.svg
file.gradlew.bat=/symbols/icons/files/gradle.svg
file.pom.xml=/emberkai/icons/maven.svg
file.mvnw=/emberkai/icons/maven.svg
file.mvnw.cmd=/emberkai/icons/maven.svg
extension.pom=/emberkai/icons/maven.svg
file..mvn/maven.config=/emberkai/icons/maven.svg
file..mvn/jvm.config=/emberkai/icons/maven.svg
file..mvn/extensions.xml=/emberkai/icons/maven.svg
file..mvn/wrapper/maven-wrapper.properties=/emberkai/icons/maven.svg
folder..mvn=/symbols/icons/folders/folder-maven.svg

# Gradle Kotlin DSL, dependency catalogs, and convention build folders.
extension.gradle.kts=/symbols/icons/files/gradle.svg
extension.versions.toml=/symbols/icons/files/gradle.svg
folder.buildsrc=/symbols/icons/folders/folder-gradle.svg
folder.build-logic=/symbols/icons/folders/folder-gradle.svg

# Context-aware icons selected by the provider.
context.spring=/emberkai/icons/spring.svg
context.helm=/emberkai/icons/helm.svg
context.helm-folder=/emberkai/icons/folder-helm.svg

# Symbols folder shape with IntelliJ source-set, root, and package cues.
folder.role.content-root=/emberkai/icons/folders/folder-content.svg
folder.role.source=/emberkai/icons/folders/folder-source.svg
folder.role.test-source=/emberkai/icons/folders/folder-test-source.svg
folder.role.resources=/emberkai/icons/folders/folder-resources.svg
folder.role.test-resources=/emberkai/icons/folders/folder-test-resources.svg
folder.role.package=/emberkai/icons/folders/folder-package.svg
folder.role.test-package=/emberkai/icons/folders/folder-test-package.svg

# Standard JVM layouts also work before the project has been imported.
folder.src=/symbols/icons/folders/folder.svg
folder.src/main=/emberkai/icons/folders/folder-content.svg
folder.src/test=/emberkai/icons/folders/folder-content.svg
folder.src/main/java=/emberkai/icons/folders/folder-source.svg
folder.src/main/kotlin=/emberkai/icons/folders/folder-source.svg
folder.src/test/java=/emberkai/icons/folders/folder-test-source.svg
folder.src/test/kotlin=/emberkai/icons/folders/folder-test-source.svg
folder.src/main/resources=/emberkai/icons/folders/folder-resources.svg
folder.src/test/resources=/emberkai/icons/folders/folder-test-resources.svg
