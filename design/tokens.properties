# Color tokens for the icon sources in design/icons, as "<light theme> <dark theme>" palette names from
# design/palette.properties. A source writes $ink where a color changes with the theme, and a palette name
# such as green-400 where it does not. IconSourcesTest generates src/main/resources/emberkai/icons from the
# sources: the light SVG, plus a _dark.svg whenever a token or a data-theme group makes the themes differ.

# Lines and outlines drawn straight on the Project view background.
ink=slate-800 slate-200
ink-strong=slate-900 slate-50
outline=slate-500 slate-300
outline-strong=slate-600 slate-300

# Halos that separate a badge from the artwork under it, and white cut-outs that go dark on dark themes.
halo=white ide-dark-background
knockout=white slate-800

# Glyphs drawn on a colored badge: dark in both themes, so they read on the badge's light fill.
badge-ink=slate-800 slate-900

# A filled badge's outline. Light themes outline it in a deep shade of its fill; dark themes outline it in the
# fill itself, since a light ring around a light badge glares and a dark one shrinks it into the background.
edge-amber-400=amber-700 amber-400
edge-blue-400=blue-700 blue-400
edge-cyan-400=cyan-700 cyan-400
edge-green-400=green-700 green-400
edge-indigo-400=indigo-700 indigo-400
edge-lime-400=lime-700 lime-400
edge-orange-400=orange-700 orange-400
edge-pink-400=pink-700 pink-400
edge-purple-400=purple-700 purple-400
edge-red-400=red-700 red-400
edge-sky-400=sky-700 sky-400
edge-teal-400=teal-700 teal-400
edge-violet-300=violet-700 violet-300
edge-violet-400=violet-700 violet-400
edge-yellow-400=yellow-700 yellow-400

# The ring around a service-folder marker: a deep shade on light themes, a lighter shade of the marker on dark themes.
rim-blue=blue-800 blue-400
rim-green=green-800 green-400
rim-orange=orange-800 orange-400
rim-pink=pink-800 pink-400
rim-purple=purple-800 purple-400
rim-red=red-800 red-400
rim-sky=sky-800 sky-400
rim-yellow=yellow-800 yellow-400

# Thin colored lines: a deeper shade on light themes, a brighter one on dark themes.
blue=blue-600 blue-400
green=green-600 green-400
orange=orange-600 orange-400
amber=amber-600 amber-400
teal=teal-600 teal-400
violet=violet-600 violet-400
violet-soft=violet-500 violet-300
yellow=yellow-500 yellow-400
green-ink=green-900 green-100

# Faceted artwork with no outline: a flat body and a deeper facet toward the bottom right. Pale hues and
# neutrals shift a shade per theme so the body stands off both backgrounds.
green-deep=green-700 green-500
steel=slate-500 slate-400
steel-deep=slate-700 slate-200
night=slate-700 slate-600
night-deep=slate-800 slate-700
paper=slate-500 slate-300
paper-fold=slate-700 slate-500
paper-ink=white slate-600
orange-deep=orange-700 orange-500
amber-deep=amber-700 amber-500
yellow-deep=yellow-700 yellow-600
lime=lime-600 lime-400
lime-deep=lime-700 lime-500
lime-ink=white lime-950
teal-deep=teal-700 teal-500
sky=sky-600 sky-400
sky-deep=sky-700 sky-500
indigo=indigo-600 indigo-400
steel-shade=slate-600 slate-500

# The facet on near-black marks such as GitHub: deeper than $ink on light themes, dimmer on dark ones.
ink-deep=slate-950 slate-400
