version: 2
updates:
  # Wait a week before proposing a new version, so a compromised release is usually pulled first.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      gradle:
        update-types: [ "minor", "patch" ]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: [ "*" ]
