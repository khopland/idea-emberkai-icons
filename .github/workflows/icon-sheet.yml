# Shows the before/after icon contact sheet that Build renders for a pull request in a comment on that
# pull request, so reviewers see changed artwork without downloading an artifact.
#
# Build runs with a read-only token, and on a fork's pull request it runs the fork's code, so it cannot
# comment. This workflow runs from main after Build finishes and never checks out or runs pull request
# code: it treats the uploaded sheet as untrusted bytes, checks that they are a PNG, stores them on the
# icon-previews branch, and finds the pull request from the run's own head commit, not from the artifact.
name: Icon sheet
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] runs no pull request code; the artifact is only stored as an image
    workflows: [ Build ]
    types: [ completed ]

permissions: {}

concurrency:
  group: icon-sheet-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  comment:
    name: Comment with changed icons
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      # The default branch's scripts, never the pull request's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Download icon contact sheet
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: icon-contact-sheet
          path: ${{ runner.temp }}/icon-sheet
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Post icon contact sheet
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SHEET: ${{ steps.download.outcome == 'success' && format('{0}/icon-sheet/icons.png', runner.temp) || '' }}
        run: bash .github/scripts/post_icon_sheet.sh
