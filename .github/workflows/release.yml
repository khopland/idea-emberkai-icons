name: Release
on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build release archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Check tag matches plugin version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(sed -n 's/^pluginVersion=//p' gradle.properties)"
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match pluginVersion $version (expected v$version)"
            exit 1
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Test, verify structure, and build
        run: ./gradlew --no-daemon test verifyPluginStructure buildPlugin
      - name: Upload installable plugin
        uses: actions/upload-artifact@v7
        with:
          name: plugin-archive
          path: build/distributions/*.zip
          if-no-files-found: error
      - name: Attach archive to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" build/distributions/*.zip --clobber

  publish:
    name: Publish to JetBrains Marketplace
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: marketplace
      url: https://plugins.jetbrains.com/plugin/com.github.khopland.symbols
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Download the tested archive
        uses: actions/download-artifact@v8
        with:
          name: plugin-archive
          path: build/distributions
      - name: Sign and publish the tested archive
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "::error::PUBLISH_TOKEN secret is not set"
            exit 1
          fi
          # The archive was already built and tested by the build job, so only sign and upload it.
          ./gradlew --no-daemon signPlugin publishPlugin -x buildPlugin
