name: Release
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Build release archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: gradle/actions/setup-gradle@v6
      - name: Generate icons
        run: deno task build
      - name: Test, verify structure, and build
        run: ./gradlew --no-daemon test verifyPluginStructure buildPlugin
      - name: Upload installable plugin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" build/distributions/*.zip --clobber
