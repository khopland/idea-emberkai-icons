name: Update icons
on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream branch, tag, or commit
        default: main
        required: true
        type: string

permissions:
  contents: read

jobs:
  update:
    name: Fetch icons and build plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update bundled icons
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
        run: ./scripts/update-icons.sh --ref "$UPSTREAM_REF"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Test, verify structure, and build
        run: ./gradlew --no-daemon test verifyPluginStructure buildPlugin
      - name: Upload updated sources
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-symbols-update
          path: |
            src/main/resources/symbols/
            src/main/resources/emberkai/
            licenses/vscode-symbols-LICENSE.txt
            NOTICE
          if-no-files-found: error
      - name: Upload installable plugin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emberkai-icons
          path: build/distributions/*.zip
          if-no-files-found: error
